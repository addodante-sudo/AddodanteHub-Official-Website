<!-- 1. Include Supabase JS SDK in head -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Replace with your actual credentials from Supabase Dashboard > Project Settings > API
  const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let activeTeacher = null;
  let enteredPin = "";

  // PIN Keypad Handlers
  function pressPinKey(num) {
    if (enteredPin.length < 4) {
      enteredPin += num;
      updatePinDots();
    }
    if (enteredPin.length === 4) {
      verifyTeacherPin(enteredPin);
    }
  }

  function clearPin() {
    enteredPin = "";
    document.getElementById('pinError').innerText = "";
    updatePinDots();
  }

  function updatePinDots() {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById(`dot${i}`);
      dot.className = i < enteredPin.length 
        ? 'w-4 h-4 rounded-full bg-emerald-400 border border-emerald-400 shadow' 
        : 'w-4 h-4 rounded-full border border-slate-600 bg-slate-800';
    }
  }

  // Direct Supabase Database PIN Authentication
  async function verifyTeacherPin(pin) {
    const errBox = document.getElementById('pinError');
    errBox.innerText = "Authenticating...";

    try {
      const { data: teacher, error } = await supabaseClient
        .from('teachers')
        .select('*')
        .eq('pin', pin)
        .single();

      if (error || !teacher) {
        throw new Error("Invalid PIN. Access denied.");
      }

      // Store teacher profile in session
      activeTeacher = teacher;
      sessionStorage.setItem('active_teacher', JSON.stringify(teacher));

      document.getElementById('loginModal').classList.add('hidden');
      applySession();
    } catch (err) {
      errBox.innerText = err.message;
      setTimeout(clearPin, 800);
    }
  }

  function applySession() {
    if (!activeTeacher) return;
    document.getElementById('activeTeacherText').innerText = activeTeacher.name;
    document.getElementById('drawerTeacherName').innerText = activeTeacher.name;
    document.getElementById('activeClassTag').innerText = activeTeacher.class_assigned;

    const select = document.getElementById('classSelect');
    if (activeTeacher.class_assigned !== 'ALL') {
      select.value = activeTeacher.class_assigned;
      select.disabled = true; // Restrict standard teachers to their assigned class
    } else {
      select.disabled = false; // Admins can switch between classes
    }
  }

  function logoutTeacher() {
    activeTeacher = null;
    sessionStorage.removeItem('active_teacher');
    clearPin();
    document.getElementById('loginModal').classList.remove('hidden');
  }

  // Restore session on refresh
  window.addEventListener('DOMContentLoaded', () => {
    const saved = sessionStorage.getItem('active_teacher');
    if (saved) {
      activeTeacher = JSON.parse(saved);
      document.getElementById('loginModal').classList.add('hidden');
      applySession();
    }
  });
</script>
